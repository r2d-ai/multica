name: R2D P04-C3 once

on:
  push:
    branches:
      - feat/p04-c3-open-only

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p04-c3-open-only
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Apply P04-C3 patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one patch target, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "server/internal/middleware/r2d_failclosed.go",
              '''func r2dQueryIssuesOpenOnly(r *http.Request) bool {
          \tfields, err := r2dReadJSONFields(r)
          \tif err != nil {
          \t\treturn true // malformed body stays fail-closed when hidden Projects exist
          \t}
          \traw, ok := fields["open_only"]
          \tif !ok {
          \t\treturn false
          \t}
          \tvar value string
          \tif json.Unmarshal(raw, &value) != nil {
          \t\treturn true
          \t}
          \treturn value == "true"
          }
          ''',
              '''func r2dQueryIssuesOpenOnly(r *http.Request) (openOnly, valid bool) {
          \tfields, err := r2dReadJSONFields(r)
          \tif err != nil {
          \t\treturn false, false
          \t}
          \traw, ok := fields["open_only"]
          \tif !ok {
          \t\treturn false, true
          \t}
          \tvar value string
          \tif json.Unmarshal(raw, &value) != nil {
          \t\treturn false, false
          \t}
          \treturn value == "true", true
          }
          ''',
          )

          replace_once(
              "server/internal/middleware/r2d_failclosed.go",
              '''\tif path == "/api/issues/query" && r.Method == http.MethodPost {
          \t\t// QueryIssues delegates to ListIssues after rebuilding the URL query.
          \t\t// P04-C2 rewrites the string-map body with readable project_ids first.
          \t\t// open_only is the exception because its legacy static query does not
          \t\t// consume project_ids; keep that mode fail-closed until it gets a native
          \t\t// predicate rather than weakening the boundary.
          \t\treturn r2dQueryIssuesOpenOnly(r)
          \t}
          ''',
              '''\tif path == "/api/issues/query" && r.Method == http.MethodPost {
          \t\t// Ordinary QueryIssues requests are constrained before SQL by P04-C2.
          \t\t// Valid open_only requests use the legacy unbounded ListOpenIssues query,
          \t\t// then C3 applies the same batched Project ACL response filter before any
          \t\t// bytes leave the server. Malformed/non-string bodies remain fail-closed so
          \t\t// the temporary guard never becomes an authorization bypass.
          \t\t_, valid := r2dQueryIssuesOpenOnly(r)
          \t\treturn !valid
          \t}
          ''',
          )

          replace_once(
              "server/internal/middleware/r2d_project_scope.go",
              '''\tkey := ""
          \tswitch {
          \tcase path == "/api/issues" || path == "/api/issues/search":
          \t\tkey = "issues"
          \tdefault:
          \t\tcopyR2DResponse(w, buf, buf.body.Bytes())
          \t\treturn
          \t}
          ''',
              '''\tkey := ""
          \tswitch {
          \tcase path == "/api/issues" || path == "/api/issues/search":
          \t\tkey = "issues"
          \tcase path == "/api/issues/query" && r.Method == http.MethodPost:
          \t\topenOnly, valid := r2dQueryIssuesOpenOnly(r)
          \t\tif !valid || !openOnly {
          \t\t\tcopyR2DResponse(w, buf, buf.body.Bytes())
          \t\t\treturn
          \t\t}
          \t\tkey = "issues"
          \tdefault:
          \t\tcopyR2DResponse(w, buf, buf.body.Bytes())
          \t\treturn
          \t}
          ''',
          )

          replace_once(
              "server/internal/middleware/r2d_project_scope.go",
              '''func shouldR2DFilterCollection(r *http.Request) bool {
          \tif r.Method != http.MethodGet {
          \t\treturn false
          \t}
          \tpath := strings.TrimSuffix(r.URL.Path, "/")
          \treturn path == "/api/projects" || path == "/api/projects/search" || path == "/api/issues" || path == "/api/issues/search"
          }
          ''',
              '''func shouldR2DFilterCollection(r *http.Request) bool {
          \tpath := strings.TrimSuffix(r.URL.Path, "/")
          \tif r.Method == http.MethodGet {
          \t\treturn path == "/api/projects" || path == "/api/projects/search" || path == "/api/issues" || path == "/api/issues/search"
          \t}
          \tif r.Method == http.MethodPost && path == "/api/issues/query" {
          \t\topenOnly, valid := r2dQueryIssuesOpenOnly(r)
          \t\treturn valid && openOnly
          \t}
          \treturn false
          }
          ''',
          )

          p = Path("server/internal/middleware/r2d_project_scope_test.go")
          text = p.read_text()
          marker = '''func TestR2DUnfilteredIssueSurface(t *testing.T) {
          '''
          if marker not in text:
              raise SystemExit("test insertion marker not found")
          addition = r'''func TestR2DOpenOnlyQueryClassification(t *testing.T) {
          	t.Parallel()
          	tests := []struct {
          		name         string
          		body         string
          		wantUnsafe   bool
          		wantFiltered bool
          	}{
          		{"open only", `{"open_only":"true"}`, false, true},
          		{"ordinary query", `{"open_only":"false"}`, false, false},
          		{"open only omitted", `{}`, false, false},
          		{"non-string open only", `{"open_only":true}`, true, false},
          		{"malformed body", `{`, true, false},
          	}
          	for _, tt := range tests {
          		req := httptest.NewRequest(http.MethodPost, "http://example.test/api/issues/query", strings.NewReader(tt.body))
          		if got := r2dUnfilteredIssueSurface(req); got != tt.wantUnsafe {
          			t.Errorf("%s: unfiltered=%v want %v", tt.name, got, tt.wantUnsafe)
          		}
          		if got := shouldR2DFilterCollection(req); got != tt.wantFiltered {
          			t.Errorf("%s: filtered=%v want %v", tt.name, got, tt.wantFiltered)
          		}
          	}
          }

          '''
          p.write_text(text.replace(marker, addition + marker, 1))
      - name: Format
        run: |
          gofmt -w \
            server/internal/middleware/r2d_failclosed.go \
            server/internal/middleware/r2d_project_scope.go \
            server/internal/middleware/r2d_project_scope_test.go
      - name: Focused tests
        working-directory: server
        run: go test ./internal/middleware ./internal/handler
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/internal/middleware/r2d_failclosed.go \
                  server/internal/middleware/r2d_project_scope.go \
                  server/internal/middleware/r2d_project_scope_test.go
          git commit -m "feat(acl): filter open-only issue queries by project visibility"
          git push origin HEAD:feat/p04-c3-open-only
