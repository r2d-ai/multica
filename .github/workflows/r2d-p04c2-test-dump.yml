name: r2d-p04c2-test-dump

on:
  push:
    branches:
      - feat/p04-c2-issue-query-enforcement

permissions:
  contents: read

jobs:
  test-dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run focused tests and capture tail
        shell: bash
        working-directory: server
        run: |
          set +e
          go test ./internal/middleware ./internal/handler > /tmp/p04c2-test.log 2>&1
          status=$?
          echo "exit_status=${status}" > ../p04c2-test.log
          tail -n 400 /tmp/p04c2-test.log >> ../p04c2-test.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: p04c2-test-log
          path: p04c2-test.log
          if-no-files-found: error
