name: Apply Codex Linux worktree fix

on:
  push:
    branches:
      - fix/codex-linux-shared-worktree

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-linux-shared-worktree
          fetch-depth: 0

      - name: Apply focused daemon fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          daemon = Path('server/internal/daemon/daemon.go')
          s = daemon.read_text()

          old_comment = '''// Both platforms now default to danger-full-access (execenv's
// codexSandboxPolicyFor), so in practice only a user who opted into
// windows.sandbox still trips the Windows case. The layout stays a per-platform
// choice rather than a per-policy one: it is decided before a task's resolved
// sandbox config is known, one workdir is reused across tasks whose policies
// can differ, and task-local metadata is correct under either policy.
'''
          new_comment = '''// Linux now defaults to danger-full-access (execenv's codexSandboxPolicyFor),
// so its shared gitdir is writable and there is no reason to duplicate Git
// metadata into every task. Keep isolated metadata only on Windows, where a
// user can still opt into the native sandbox and make the shared gitdir
// read-only. This deliberately prefers the shared worktree layout on Linux to
// keep large repositories from multiplying their .git footprint per task.
'''
          if s.count(old_comment) != 1:
              raise SystemExit('expected Codex checkout comment exactly once')
          s = s.replace(old_comment, new_comment)

          old_func = '''func repoCheckoutModeFor(provider, goos string) string {
\tif provider != "codex" {
\t\treturn ""
\t}
\tswitch goos {
\tcase "linux", "windows":
\t\treturn repoCheckoutModeIsolated
\tdefault:
\t\treturn ""
\t}
}
'''
          new_func = '''func repoCheckoutModeFor(provider, goos string) string {
\tif provider == "codex" && goos == "windows" {
\t\treturn repoCheckoutModeIsolated
\t}
\treturn ""
}
'''
          if s.count(old_func) != 1:
              raise SystemExit('expected repoCheckoutModeFor exactly once')
          daemon.write_text(s.replace(old_func, new_func))

          tests = Path('server/internal/daemon/daemon_test.go')
          t = tests.read_text()
          old_case = '{name: "Linux Codex isolates Git metadata", provider: "codex", goos: "linux", want: repoCheckoutModeIsolated},'
          new_case = '{name: "Linux Codex keeps shared worktree", provider: "codex", goos: "linux"},'
          if t.count(old_case) != 1:
              raise SystemExit('expected Linux Codex test case exactly once')
          tests.write_text(t.replace(old_case, new_case))
          PY

          gofmt -w server/internal/daemon/daemon.go server/internal/daemon/daemon_test.go
          go test ./server/internal/daemon -run '^TestRepoCheckoutModeFor$' -count=1

      - name: Commit fix and remove staging workflow
        shell: bash
        run: |
          git config user.name "multica-fork-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-codex-linux-worktree-fix.yml
          git add server/internal/daemon/daemon.go server/internal/daemon/daemon_test.go
          git commit -m "fix(daemon): use shared worktrees for Codex on Linux"
          git push origin HEAD:fix/codex-linux-shared-worktree
