name: r2d-p04c2-test2

on:
  push:
    branches:
      - feat/p04-c2-issue-query-enforcement

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: gofmt -w server/internal/middleware server/pkg/db/generated/r2d_issue_acl_ext.go server/internal/handler/r2d_issue_table_acl.go
      - name: Focused tests
        id: tests
        continue-on-error: true
        run: cd server && go test ./internal/middleware ./internal/handler
      - name: Commit format and remove workflow
        if: always()
        run: |
          rm .github/workflows/r2d-p04c2-test2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/internal/middleware server/pkg/db/generated/r2d_issue_acl_ext.go server/internal/handler/r2d_issue_table_acl.go .github/workflows/r2d-p04c2-test2.yml
          if ! git diff --cached --quiet; then
            git commit -m "style(acl): format C2 child ACL"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Propagate test result
        if: steps.tests.outcome != 'success'
        run: exit 1
