name: r2d-p04c2-check

on:
  push:
    branches:
      - feat/p04-c2-issue-query-enforcement

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: test -z "$(gofmt -l server/internal/middleware server/internal/handler/r2d_issue_table_acl.go)"
      - name: Focused tests
        run: cd server && go test ./internal/middleware ./internal/handler
      - name: Remove one-shot workflow
        if: always()
        run: |
          rm .github/workflows/r2d-p04c2-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/r2d-p04c2-check.yml
          git commit -m "chore(r2d): remove C2 check workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
