name: r2d-p04c2-route-mount

on:
  push:
    branches:
      - feat/p04-c2-issue-query-enforcement

permissions:
  contents: write

jobs:
  patch-router:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mount R2D sharing routes and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path

          router = Path("server/cmd/server/router.go")
          source = router.read_text()
          marker = "\t\t// --- Workspace-scoped routes (all require workspace membership) ---"
          mount = "\t\tregisterR2DProjectSharingRoutes(r, h)\n\n"
          if mount not in source:
              if marker not in source:
                  raise SystemExit("workspace route marker not found")
              source = source.replace(marker, mount + marker, 1)
              router.write_text(source)

          Path(".github/workflows/r2d-p04c2-route-mount.yml").unlink()
      - name: Commit route mount
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/cmd/server/router.go .github/workflows/r2d-p04c2-route-mount.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(acl): mount R2D project sharing routes"
          git push origin HEAD:${GITHUB_REF_NAME}
