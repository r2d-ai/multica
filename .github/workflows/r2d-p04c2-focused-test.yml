name: r2d-p04c2-focused-test

on:
  push:
    branches:
      - feat/p04-c2-issue-query-enforcement

permissions:
  contents: write

jobs:
  focused-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run focused tests
        id: tests
        continue-on-error: true
        working-directory: server
        run: go test ./internal/middleware ./internal/handler
      - name: Remove one-shot workflow
        if: always()
        run: |
          rm .github/workflows/r2d-p04c2-focused-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/r2d-p04c2-focused-test.yml
          git commit -m "chore(r2d): remove focused test workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Propagate test result
        if: steps.tests.outcome != 'success'
        run: exit 1
