name: r2d-p04c2-query-native

on:
  push:
    branches:
      - feat/p04-c2-issue-query-enforcement

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ACL-native Issue query hooks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/internal/handler/issue.go')
          s = p.read_text()
          def rep(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'anchor count {n}, expected 1: {old[:100]!r}')
              s = s.replace(old, new, 1)

          rep(
          'func buildSearchQuery(phrase string, terms []string, queryNum int, hasNum bool, includeClosed bool, terminalStatusKeys []string) (string, []any) {',
          '''func buildSearchQuery(phrase string, terms []string, queryNum int, hasNum bool, includeClosed bool, terminalStatusKeys []string) (string, []any) {
\treturn buildSearchQueryWithVisibility(phrase, terms, queryNum, hasNum, includeClosed, terminalStatusKeys, nil, pgtype.UUID{})
}

func buildSearchQueryWithVisibility(phrase string, terms []string, queryNum int, hasNum bool, includeClosed bool, terminalStatusKeys []string, readableProjectIDs []pgtype.UUID, projectFilter pgtype.UUID) (string, []any) {''')

          rep(
          '''\twsParam := nextArg(nil)                                   // $4: workspace_id, filled by caller

\tvar termContainsParams []string''',
          '''\twsParam := nextArg(nil) // $4: workspace_id, filled by caller
\tvisibilityParam := ""
\tif readableProjectIDs != nil {
\t\tvisibilityParam = nextArg(readableProjectIDs)
\t}
\tprojectParam := ""
\tif projectFilter.Valid {
\t\tprojectParam = nextArg(projectFilter)
\t}

\tvar termContainsParams []string''')

          rep(
          '''\tissueWhere := "i.workspace_id = " + wsParam
\tif terminalStatusesParam != "" {''',
          '''\tissueWhere := "i.workspace_id = " + wsParam
\tif visibilityParam != "" {
\t\tissueWhere += " AND (i.project_id IS NULL OR i.project_id = ANY(" + visibilityParam + "::uuid[]))"
\t}
\tif projectParam != "" {
\t\tissueWhere += " AND i.project_id = " + projectParam + "::uuid"
\t}
\tif terminalStatusesParam != "" {''')

          rep(
          '''\twsUUID, ok := parseUUIDOrBadRequest(w, workspaceID, "workspace_id")
\tif !ok {
\t\treturn
\t}
\tterms := splitSearchTerms(q)''',
          '''\twsUUID, ok := parseUUIDOrBadRequest(w, workspaceID, "workspace_id")
\tif !ok {
\t\treturn
\t}
\tuserID, ok := requireUserID(w, r)
\tif !ok {
\t\treturn
\t}
\treadableProjectIDs, err := h.r2dReadableWorkspaceProjectIDs(ctx, userID, workspaceID)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to apply project visibility")
\t\treturn
\t}
\tvar searchProjectFilter pgtype.UUID
\tif raw := strings.TrimSpace(r.URL.Query().Get("project_id")); raw != "" {
\t\tsearchProjectFilter, ok = parseUUIDOrBadRequest(w, raw, "project_id")
\t\tif !ok {
\t\t\treturn
\t\t}
\t}
\tterms := splitSearchTerms(q)''')

          rep(
          '''\tsqlQuery, args := buildSearchQuery(q, terms, queryNum, hasNum, includeClosed, terminalStatusKeys)
\t// Fill placeholder args: $4 = workspace_id, last two = limit, offset''',
          '''\tsqlQuery, args := buildSearchQueryWithVisibility(q, terms, queryNum, hasNum, includeClosed, terminalStatusKeys, readableProjectIDs, searchProjectFilter)
\t// Fill placeholder args: $4 = workspace_id, last two = limit, offset''')

          rep(
          '''\tdateFilter, ok := parseIssueDateFilter(w, r.URL.Query())
\tif !ok {
\t\treturn
\t}

\t// open_only=true returns all non-done/cancelled issues (no limit).''',
          '''\tdateFilter, ok := parseIssueDateFilter(w, r.URL.Query())
\tif !ok {
\t\treturn
\t}
\tuserID, ok := requireUserID(w, r)
\tif !ok {
\t\treturn
\t}
\treadableProjectIDs, err := h.r2dReadableWorkspaceProjectIDs(ctx, userID, workspaceID)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to apply project visibility")
\t\treturn
\t}
\treadableProjectSet := r2dProjectUUIDSet(readableProjectIDs)

\t// open_only=true returns all non-done/cancelled issues (no limit).''')

          rep(
          '''\t\tif err != nil {
\t\t\twriteError(w, http.StatusInternalServerError, "failed to list issues")
\t\t\treturn
\t\t}

\t\tprefix := h.getIssuePrefix(ctx, wsUUID)''',
          '''\t\tif err != nil {
\t\t\twriteError(w, http.StatusInternalServerError, "failed to list issues")
\t\t\treturn
\t\t}
\t\tvisibleIssues := issues[:0]
\t\tfor _, issue := range issues {
\t\t\tif r2dIssueProjectVisible(issue.ProjectID, readableProjectSet, true) {
\t\t\t\tvisibleIssues = append(visibleIssues, issue)
\t\t\t}
\t\t}
\t\tissues = visibleIssues

\t\tprefix := h.getIssuePrefix(ctx, wsUUID)''')

          rep(
          '''\t// Build dynamic SQL — same approach as ListGroupedIssues.
\twhere := []string{"i.workspace_id = $1"}
\targs := []any{wsUUID}''',
          '''\t// Build dynamic SQL — same approach as ListGroupedIssues. Project
\t// visibility is part of the SQL window so pagination/count cannot be
\t// displaced by hidden Project rows.
\twhere := []string{"i.workspace_id = $1 AND (i.project_id IS NULL OR i.project_id = ANY($2::uuid[]))"}
\targs := []any{wsUUID, readableProjectIDs}''')

          rep(
          '''\tworkspaceID := h.resolveWorkspaceID(r)
\twsUUID, ok := parseUUIDOrBadRequest(w, workspaceID, "workspace_id")
\tif !ok {
\t\treturn
\t}

\tlimit := 50''',
          '''\tworkspaceID := h.resolveWorkspaceID(r)
\twsUUID, ok := parseUUIDOrBadRequest(w, workspaceID, "workspace_id")
\tif !ok {
\t\treturn
\t}
\tuserID, ok := requireUserID(w, r)
\tif !ok {
\t\treturn
\t}
\treadableProjectIDs, err := h.r2dReadableWorkspaceProjectIDs(ctx, userID, workspaceID)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to apply project visibility")
\t\treturn
\t}

\tlimit := 50''')

          rep(
          '''\twhere := []string{"i.workspace_id = $1"}
\targs := []any{wsUUID}
\taddArg := func(v any) string {''',
          '''\twhere := []string{"i.workspace_id = $1 AND (i.project_id IS NULL OR i.project_id = ANY($2::uuid[]))"}
\targs := []any{wsUUID, readableProjectIDs}
\taddArg := func(v any) string {''')

          rep(
          '''\tchildren, err := h.Queries.ListChildIssues(r.Context(), issue.ID)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to list child issues")
\t\treturn
\t}
\tprefix := h.getIssuePrefix(r.Context(), issue.WorkspaceID)''',
          '''\tchildren, err := h.Queries.ListChildIssues(r.Context(), issue.ID)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to list child issues")
\t\treturn
\t}
\tuserID, ok := requireUserID(w, r)
\tif !ok {
\t\treturn
\t}
\tworkspaceID := util.UUIDToString(issue.WorkspaceID)
\treadableProjectIDs, err := h.r2dReadableWorkspaceProjectIDs(r.Context(), userID, workspaceID)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to apply project visibility")
\t\treturn
\t}
\tallowProjectless, err := h.r2dCanReadProjectlessIssues(r.Context(), userID, workspaceID)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to apply project visibility")
\t\treturn
\t}
\treadableProjectSet := r2dProjectUUIDSet(readableProjectIDs)
\tvisibleChildren := children[:0]
\tfor _, child := range children {
\t\tif r2dIssueProjectVisible(child.ProjectID, readableProjectSet, allowProjectless) {
\t\t\tvisibleChildren = append(visibleChildren, child)
\t\t}
\t}
\tchildren = visibleChildren
\tprefix := h.getIssuePrefix(r.Context(), issue.WorkspaceID)''')

          rep(
          '''\tchildren, err := h.Queries.ListChildrenByParents(r.Context(), db.ListChildrenByParentsParams{
\t\tWorkspaceID: wsUUID,
\t\tParentIds:   parentIDs,
\t})
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to list child issues")
\t\treturn
\t}
\tprefix := h.getIssuePrefix(r.Context(), wsUUID)''',
          '''\tuserID, ok := requireUserID(w, r)
\tif !ok {
\t\treturn
\t}
\treadableProjectIDs, err := h.r2dReadableWorkspaceProjectIDs(r.Context(), userID, workspaceID)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to apply project visibility")
\t\treturn
\t}
\tparentRows, err := h.DB.Query(r.Context(), `
SELECT id FROM issue
WHERE workspace_id = $1
  AND id = ANY($2::uuid[])
  AND (project_id IS NULL OR project_id = ANY($3::uuid[]))`, wsUUID, parentIDs, readableProjectIDs)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to authorize parent issues")
\t\treturn
\t}
\tvisibleParentIDs := make([]pgtype.UUID, 0, len(parentIDs))
\tfor parentRows.Next() {
\t\tvar id pgtype.UUID
\t\tif err := parentRows.Scan(&id); err != nil {
\t\t\tparentRows.Close()
\t\t\twriteError(w, http.StatusInternalServerError, "failed to authorize parent issues")
\t\t\treturn
\t\t}
\t\tvisibleParentIDs = append(visibleParentIDs, id)
\t}
\tif err := parentRows.Err(); err != nil {
\t\tparentRows.Close()
\t\twriteError(w, http.StatusInternalServerError, "failed to authorize parent issues")
\t\treturn
\t}
\tparentRows.Close()
\tif len(visibleParentIDs) == 0 {
\t\twriteJSON(w, http.StatusOK, map[string]any{"issues": []IssueResponse{}})
\t\treturn
\t}
\n\tchildren, err := h.Queries.ListChildrenByParents(r.Context(), db.ListChildrenByParentsParams{
\t\tWorkspaceID: wsUUID,
\t\tParentIds:   visibleParentIDs,
\t})
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to list child issues")
\t\treturn
\t}
\treadableProjectSet := r2dProjectUUIDSet(readableProjectIDs)
\tvisibleChildren := children[:0]
\tfor _, child := range children {
\t\tif r2dIssueProjectVisible(child.ProjectID, readableProjectSet, true) {
\t\t\tvisibleChildren = append(visibleChildren, child)
\t\t}
\t}
\tchildren = visibleChildren
\tprefix := h.getIssuePrefix(r.Context(), wsUUID)''')

          old = '''\trows, err := h.Queries.ChildIssueProgress(r.Context(), db.ChildIssueProgressParams{
\t\tWorkspaceID:        wsUUID,
\t\tTerminalStatusKeys: terminalStatusKeys,
\t})
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to get child issue progress")
\t\treturn
\t}

\ttype progressEntry struct {
\t\tParentIssueID string `json:"parent_issue_id"`
\t\tTotal         int64  `json:"total"`
\t\tDone          int64  `json:"done"`
\t}
\tresp := make([]progressEntry, len(rows))
\tfor i, row := range rows {
\t\tresp[i] = progressEntry{
\t\t\tParentIssueID: uuidToString(row.ParentIssueID),
\t\t\tTotal:         row.Total,
\t\t\tDone:          row.Done,
\t\t}
\t}'''
          new = '''\tuserID, ok := requireUserID(w, r)
\tif !ok {
\t\treturn
\t}
\treadableProjectIDs, err := h.r2dReadableWorkspaceProjectIDs(r.Context(), userID, wsID)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to apply project visibility")
\t\treturn
\t}
\trows, err := h.DB.Query(r.Context(), `
SELECT i.parent_issue_id,
       COUNT(*)::bigint AS total,
       COUNT(*) FILTER (WHERE i.status = ANY($3::text[]))::bigint AS done
FROM issue i
JOIN issue p ON p.id = i.parent_issue_id AND p.workspace_id = i.workspace_id
WHERE i.workspace_id = $1
  AND i.parent_issue_id IS NOT NULL
  AND (i.project_id IS NULL OR i.project_id = ANY($2::uuid[]))
  AND (p.project_id IS NULL OR p.project_id = ANY($2::uuid[]))
GROUP BY i.parent_issue_id`, wsUUID, readableProjectIDs, terminalStatusKeys)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to get child issue progress")
\t\treturn
\t}
\tdefer rows.Close()

\ttype progressEntry struct {
\t\tParentIssueID string `json:"parent_issue_id"`
\t\tTotal         int64  `json:"total"`
\t\tDone          int64  `json:"done"`
\t}
\tresp := make([]progressEntry, 0)
\tfor rows.Next() {
\t\tvar parentID pgtype.UUID
\t\tvar total, done int64
\t\tif err := rows.Scan(&parentID, &total, &done); err != nil {
\t\t\twriteError(w, http.StatusInternalServerError, "failed to get child issue progress")
\t\t\treturn
\t\t}
\t\tresp = append(resp, progressEntry{
\t\t\tParentIssueID: uuidToString(parentID),
\t\t\tTotal:         total,
\t\t\tDone:          done,
\t\t})
\t}
\tif err := rows.Err(); err != nil {
\t\twriteError(w, http.StatusInternalServerError, "failed to get child issue progress")
\t\treturn
\t}'''
          rep(old, new)

          p.write_text(s)
          PY
      - name: Format
        run: gofmt -w server/internal/handler/issue.go server/internal/handler/r2d_issue_table_acl.go
      - name: Run focused tests
        id: tests
        continue-on-error: true
        working-directory: server
        run: go test ./internal/handler ./internal/middleware
      - name: Commit implementation and remove workflow
        if: always()
        shell: bash
        run: |
          rm .github/workflows/r2d-p04c2-query-native.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/internal/handler/issue.go server/internal/handler/r2d_issue_table_acl.go .github/workflows/r2d-p04c2-query-native.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat(acl): enforce native Issue query visibility"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Propagate test result
        if: steps.tests.outcome != 'success'
        run: exit 1
