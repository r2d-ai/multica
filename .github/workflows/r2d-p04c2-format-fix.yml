name: r2d-p04c2-format-fix

on:
  push:
    branches:
      - feat/p04-c2-issue-query-enforcement

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format R2D Go files
        working-directory: server
        run: gofmt -w internal/middleware/r2d_*.go pkg/db/generated/r2d_*.go
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/internal/middleware/r2d_*.go server/pkg/db/generated/r2d_*.go
          git diff --cached --quiet || git commit -m 'style(acl): gofmt P04-C2 files'
          git push
